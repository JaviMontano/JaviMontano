  </text>
  <text x="99" y="252" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">
    Founder &amp; Empowerment Officer @ MetodologIA
  </text>

  <text x="99" y="282" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">
    Senior Consultant / Offer Manager @ Amaris Consulting
  </text>
