<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Javier Montaño profile banner</title>
  <desc id="desc">Brand banner for Javier Montaño: agentic systems, methodology, pedagogy and AI delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.46" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="mesh" x1="158" y1="-20" x2="1024" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#f8fafc" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.36"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <path d="M-24 278C124 182 251 167 421 229C611 299 737 151 902 96C1039 50 1138 94 1232 152V396H-24V278Z" fill="url(#mesh)"/>
  <circle cx="1000" cy="78" r="120" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="1110" cy="286" r="64" fill="#020617" fill-opacity="0.18"/>
  <circle cx="121" cy="90" r="70" fill="#38bdf8" fill-opacity="0.14"/>

  <g filter="url(#softShadow)">
    <rect x="64" y="58" width="1072" height="244" rx="28" fill="#07111f" fill-opacity="0.68" stroke="#ffffff" stroke-opacity="0.18"/>
  </g>

  <text x="95" y="124" fill="#a7f3d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">
    CONSULTING / OPERATIONS / MANAGEMENT
  </text>
  <text x="95" y="178" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">
